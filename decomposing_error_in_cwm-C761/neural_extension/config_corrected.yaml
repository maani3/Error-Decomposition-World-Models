# Corrected paired neural experiment for "Grading the Update, Not the Model".
# This is a new run and does not overwrite or reinterpret the original results.

master_seed: 20260830

simulator:
  dt: 0.05
  integrator: rk4
  v0: {g: 9.8, L: 1.0, c: 0.15}
  v1: {g: 11.5, L: 1.0, c: 0.15}

panel:
  thetas: [-2.0, -1.0, -0.25, 0.25, 1.0, 2.0]
  omegas: [-1.5, 0.0, 1.5]

horizons: [1, 3, 5, 10, 20]
max_horizon: 20
zero_effect_threshold: 1.0e-6

data:
  traj_transitions: 30
  init_theta_range: [-2.5, 2.5]
  init_omega_range: [-2.0, 2.0]
  obs_noise_sigma: 0.05
  n1_trajectories: 40
  n0_grid: [5, 15, 40, 150, 500]

model:
  hidden: [64, 64]
  activation: tanh
  predicts: state_delta

training:
  optimizer: adam
  lr: 1.0e-3
  batch_size: 256
  max_epochs: 2000
  val_frac: 0.10
  patience: 100

update_rules:
  refit: {}
  replay:
    subsample_size: match_d1_training_transitions
  proximal:
    mus: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0]

seeds_per_condition: 100

exclusions:
  base_mse_median_factor: 10.0
  divergence_theta_abs: 50.0

corrected_design:
  split_unit: trajectory
  validation_assignment: every_tenth_trajectory_starting_at_zero
  nested_d0_prefixes: true
  shared_d1_across_n0: true
  shared_d1_validation_across_rules: true
  shared_base_initialization_across_n0: true
  shared_proximal_batch_seed_across_mu_and_n0: true
  primary_comparison: refit_vs_proximal_1_predicted_direction
  tie_relative_tolerances: [0.01, 0.05, 0.10]
  bootstrap_repetitions: 20000
  results_file: results_corrected/results_v1.pkl

